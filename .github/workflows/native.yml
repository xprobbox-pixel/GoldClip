name: Native product build, validation and installers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4 numpy==2.2.6 matplotlib==3.10.3
      - name: Build and test macOS Universal
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/validation
          set -o pipefail
          bash scripts/build-macos.sh 2>&1 | tee dist/validation/build.txt
      - name: Build and test Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/validation | Out-Null
          Start-Transcript -Path dist/validation/build.txt
          try { ./scripts/build-windows.ps1 } finally { Stop-Transcript }
      - name: Render measured DSP plots
        run: python scripts/plot-measurements.py dist/measurements
      - name: Validate macOS VST3 and AU plugins
        if: runner.os == 'macOS'
        run: |
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip -d validator
          for variant in Master Track; do
            validator/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "dist/$variant/VST3/AURUM CLIP $variant.vst3" > "dist/validation/pluginval-$variant.txt" 2>&1
          done
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          for variant in Master Track; do
            ditto "dist/$variant/AU/AURUM CLIP $variant.component" "$HOME/Library/Audio/Plug-Ins/Components/AURUM CLIP $variant.component"
          done
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx AuMs AuDv > dist/validation/auval-Master.txt 2>&1
          auval -strict -v aufx AuTr AuDv > dist/validation/auval-Track.txt 2>&1
      - name: Validate Windows VST3 plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip validator
          foreach ($variant in @('Master','Track')) {
            & ./validator/pluginval.exe --strictness-level 5 --validate "dist/$variant/VST3/AURUM CLIP $variant.vst3" 2>&1 | Tee-Object "dist/validation/pluginval-$variant.txt"
            if ($LASTEXITCODE -ne 0) { throw "pluginval $variant failed" }
          }
      - name: Build and test macOS installer
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          bash scripts/package-macos.sh 2>&1 | tee dist/validation/packaging.txt
          bash scripts/test-installer-macos.sh 2>&1 | tee dist/validation/installer-test.txt
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 2>&1 | Tee-Object dist/validation/packaging.txt
          ./scripts/test-installer-windows.ps1 2>&1 | Tee-Object dist/validation/installer-test.txt
      - name: Final artifact manifest
        if: always()
        run: python scripts/manifest.py dist
      - name: Upload successful native binaries
        uses: actions/upload-artifact@v4
        with:
          name: AURUM-CLIP-1.0.0-${{ runner.os }}
          path: dist
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AURUM-CLIP-1.0.0-${{ runner.os }}-failure-logs
          path: |
            dist/validation
            build/**/Testing/Temporary/LastTest.log
